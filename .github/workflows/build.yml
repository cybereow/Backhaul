name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-amd64:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: go build -ldflags="-s -w" -o backhaul_linux_amd64 ./main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backhaul_linux_amd64
          path: backhaul_linux_amd64

  build-linux-amd64-openssl:
    name: Build (linux/amd64, openssl)
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install libssl headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build
        run: go build -ldflags="-s -w" -tags openssl -o backhaul_linux_amd64_openssl ./main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backhaul_linux_amd64_openssl
          path: backhaul_linux_amd64_openssl

  test-linux-amd64:
    name: Test (linux/amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Test (full suite)
        run: go test -mod=readonly -count=1 -timeout=180s ./...

      - name: Test with race detector (targeted packages)
        env:
          CGO_ENABLED: 1
        run: >
          go test -mod=readonly -race -count=1 -timeout=300s
          ./internal/utils/network
          ./internal/utils/handlers
          ./internal/utils/striping
          ./internal/client/transport
          ./internal/server/transport
