name: CI

# Runs on every commit pushed to a branch. Tags are handled by release.yml, so a
# release does not run the whole matrix a second time.
on:
  push:
    branches: ['**']

permissions:
  contents: read

# A newer commit on the same branch makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (linux/amd64, OpenSSL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # The server terminates TLS with OpenSSL through cgo, so every build and
      # test needs the headers.
      - name: Install libssl headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -ldflags="-s -w" -o backhaul_linux_amd64 ./main.go

      - name: go test (race)
        run: go test -race -count=1 -timeout=300s ./...

      - uses: actions/upload-artifact@v4
        with:
          name: backhaul_linux_amd64
          path: backhaul_linux_amd64

  e2e:
    name: E2E ${{ matrix.transport }} / net=${{ matrix.netem }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [ws, wss, wsmux, wssmux]
        netem: [off, wan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install libssl headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev

      - name: Build binaries
        run: |
          go build -o /tmp/backhaul ./main.go
          go build -o /tmp/loadgen ./e2e/loadgen

      # netem lives in sch_netem/sch_prio; the runner images ship them, but fail
      # loudly here rather than later reporting a "WAN" run that had no WAN.
      - name: Check netem is available
        if: matrix.netem == 'wan'
        run: |
          sudo modprobe sch_netem || true
          sudo modprobe sch_prio || true
          sudo tc qdisc add dev lo root netem delay 1ms
          sudo tc qdisc del dev lo root

      - name: Run end-to-end comparison
        env:
          BACKHAUL_BIN: /tmp/backhaul
          LOADGEN_BIN: /tmp/loadgen
          SUDO: sudo
        run: |
          ./e2e/run.sh \
            --transport ${{ matrix.transport }} \
            --netem ${{ matrix.netem }} \
            --out /tmp/result.json

      # Every reported number comes from a run that also verified each byte
      # against a deterministic pattern, so this doubles as a corruption and
      # truncation check on a real tunnel.
      - name: Assert payload integrity
        run: |
          for path in .baseline.bulk .baseline.rr .baseline.conc \
                      .tunnel.bulk .tunnel.rr .tunnel.conc; do
            ok="$(jq -r "$path.verified" /tmp/result.json)"
            if [ "$ok" != "true" ]; then
              echo "payload verification failed at $path" >&2
              jq . /tmp/result.json >&2
              exit 1
            fi
          done
          echo "all six measurements verified their payload"

      - name: Summary
        run: |
          jq -r '
            "### " + .transport + " (net=" + .netem + ")\n\n" +
            "_workload: " + (.workload.rr_requests|tostring) + " x "
              + (.workload.rr_size|tostring) + "B exchanges, "
              + ((.workload.bulk_bytes/1048576)|floor|tostring) + "MB bulk_\n\n" +
            "| workload | direct (no tunnel) | through backhaul | ratio |\n" +
            "|---|---|---|---|\n" +
            "| bulk MB/s | " + (.baseline.bulk.mb_per_sec|tostring|.[0:7])
              + " | " + (.tunnel.bulk.mb_per_sec|tostring|.[0:7])
              + " | " + ((.tunnel.bulk.mb_per_sec / .baseline.bulk.mb_per_sec * 100)|tostring|.[0:5]) + "% |\n" +
            "| req/s, 1 conn | " + (.baseline.rr.req_per_sec|tostring|.[0:7])
              + " | " + (.tunnel.rr.req_per_sec|tostring|.[0:7])
              + " | " + ((.tunnel.rr.req_per_sec / .baseline.rr.req_per_sec * 100)|tostring|.[0:5]) + "% |\n" +
            "| req/s, " + (.workload.conc_conns|tostring) + " conns | "
              + (.baseline.conc.req_per_sec|tostring|.[0:7])
              + " | " + (.tunnel.conc.req_per_sec|tostring|.[0:7])
              + " | " + ((.tunnel.conc.req_per_sec / .baseline.conc.req_per_sec * 100)|tostring|.[0:5]) + "% |\n" +
            "| p50 latency us | " + (.baseline.rr.p50_micros|tostring)
              + " | " + (.tunnel.rr.p50_micros|tostring) + " | |\n" +
            "| p99 latency us | " + (.baseline.rr.p99_micros|tostring)
              + " | " + (.tunnel.rr.p99_micros|tostring) + " | |\n\n" +
            "Latency the tunnel adds at p50: **"
              + ((.tunnel.rr.p50_micros - .baseline.rr.p50_micros)|tostring) + " us**.\n\n" +
            (if .netem == "off" then
              "> On this profile the baseline is loopback, an RTT of tens of microseconds. "
              + "The tunnel adds two process hops and its framing, so a fixed cost of a few "
              + "hundred microseconds looks enormous as a ratio while being irrelevant on any "
              + "real path. Read the absolute figure above, and read the net=wan rows for the "
              + "ratio that means something.\n"
             else
              "> Each path crosses the emulated WAN exactly once: the baseline reaches the "
              + "service across it, the tunnel carries the WAN on its client<->server link "
              + "while both of its end hops are local.\n"
             end)
          ' /tmp/result.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.transport }}-${{ matrix.netem }}
          path: /tmp/result.json

      # Last step on purpose: one greppable line at the very end of the log, so
      # the headline numbers can be read without paging through the whole job.
      - name: One-line result
        run: |
          jq -r '"RESULT " + .transport + " net=" + .netem
            + " | bulk " + (.baseline.bulk.mb_per_sec|tostring|.[0:6]) + " -> "
              + (.tunnel.bulk.mb_per_sec|tostring|.[0:6]) + " MB/s ("
              + ((.tunnel.bulk.mb_per_sec/.baseline.bulk.mb_per_sec*100)|tostring|.[0:5]) + "%)"
            + " | rps " + (.baseline.rr.req_per_sec|tostring|.[0:6]) + " -> "
              + (.tunnel.rr.req_per_sec|tostring|.[0:6]) + " ("
              + ((.tunnel.rr.req_per_sec/.baseline.rr.req_per_sec*100)|tostring|.[0:5]) + "%)"
            + " | p50 " + (.baseline.rr.p50_micros|tostring) + " -> "
              + (.tunnel.rr.p50_micros|tostring) + " us (+"
              + ((.tunnel.rr.p50_micros - .baseline.rr.p50_micros)|tostring) + ")"
            + " | conc" + (.workload.conc_conns|tostring) + " "
              + (.baseline.conc.req_per_sec|tostring|.[0:6]) + " -> "
              + (.tunnel.conc.req_per_sec|tostring|.[0:6]) + " ("
              + ((.tunnel.conc.req_per_sec/.baseline.conc.req_per_sec*100)|tostring|.[0:5]) + "%)"' \
            /tmp/result.json
