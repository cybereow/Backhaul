name: Release

# Runs only when a version tag is pushed (v*). Publishes the linux/amd64 binary
# to the GitHub release and the linux/amd64 image to Docker Hub.
#
# Docker Hub needs two repository secrets:
#   DOCKERHUB_USERNAME - the Docker Hub namespace (image: <username>/backhaul)
#   DOCKERHUB_TOKEN    - a Docker Hub access token
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  binary:
    name: GitHub release (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install libssl headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/backhaul
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          # Default flavor (latest=auto) also tags :latest for semver tag pushes.

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
