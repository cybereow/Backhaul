version: 2
project_name: backhaul

# One build: linux/amd64, dynamically linked against the system OpenSSL
# (cgo + libssl). The server terminates wss/wssmux TLS with it.
builds:
  - id: backhaul
    main: ./main.go
    binary: backhaul
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -ldflags=-s -w
    env:
      - CGO_ENABLED=1

archives:
  - id: backhaul
    ids:
      - backhaul
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
