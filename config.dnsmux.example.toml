# dnsmux: tunnel over DNS queries through recursive resolvers.
#
# Prerequisites: a domain you control with an NS delegation of the tunnel
# sub-domain (dns_domain) to the SERVER host, UDP+TCP port 53 reachable there
# and free (on Ubuntu: stop/disable systemd-resolved's stub listener).
# The CLIENT never contacts the server directly, only the listed resolvers.
# NOTE: the tunnel payload is authenticated (token challenge-response) but NOT
# encrypted; anything sensitive inside it must be encrypted end to end.
# Throughput is low by design (about 100 bytes per query upstream); this
# transport is for networks where nothing else gets through.

# ---- server (the box the NS record points to) ----
[server]
transport = "dnsmux"
token = "change-me"            # shared token, same on both sides
dns_domain = "ttt.example.com" # sub-zone delegated to this host
dns_listen = "0.0.0.0:53"      # authoritative responder (UDP+TCP)
# dns_key = ""                 # per-query MAC secret; defaults to token (set a different one)
ports = ["8080=127.0.0.1:80"]  # local listener = target the CLIENT dials
log_level = "info"

# ---- client ----
# [client]
# transport = "dnsmux"
# token = "change-me"
# dns_domain = "ttt.example.com"
# dns_resolvers = []           # empty (or containing "auto") = test a built-in list of Iranian public
#                              # resolvers at startup and keep the ones that work from here;
#                              # add your own: ["auto", "1.2.3.4"]; an explicit list disables auto
# dns_record_types = []        # empty = try all (TXT, NULL, A, AAAA, CNAME, MX, SRV, PTR); the best is auto-selected
# dns_resolver_cidrs = []      # extra candidates to test at startup, e.g. ["198.51.100.0/24"] (rate-limited, max 4096 addresses)
# dns_resolver_cache = ""     # file to cache the discovered best resolvers (reused for 30 min)
# dns_timeout_ms = 2000        # per-query timeout
# dns_workers = 16             # DNS queries in flight per tunnel connection (with SACK, 16 measured ~30% faster than 8)
# connection_pool = 1          # parallel tunnel connections
# dns_no_hedge = false         # hedging: start one extra query when one is slow (resolvers sometimes sit on a query ~2s)
# retry_interval = 3
# log_level = "info"
